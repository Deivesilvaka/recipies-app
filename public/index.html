<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Troque sua senha!</title>
  </head>
  <body>
    <h2>Modifique sua senha</h2>

    <form action="/user/forget-password" method="post">
      Email: <input type="email" name="email" id="email" /><br /><br />
      Senha: <input type="password" name="password" id="password" /><br /><br />
      Confirme sua senha:
      <input
        type="password"
        name="confirmPassword"
        id="confirmPassword"
      /><br /><br />

      <input type="submit" value="Salvar" />
    </form>
  </body>
</html>
